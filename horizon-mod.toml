id = "mekmm"
name = "Mekanism: MoreMachine"
version = "0.2.0"
description = """A port of Mekanism: MoreMachine for Horizon, slice 1: the Basic Recycling Factory. One
block whose three processes each spend 50 FE/t for 200 ticks out of the one shared 20,000 FE
buffer, consuming one item at the end of the operation and producing `mekmm:scrap` on the jar's
17 % chance roll: 9 stones, dirt and grass_block recycle, an input with no recipe or no energy
burns nothing, and a full output slot holds the progress. The buffer is a real block energy
capability another mod's cable can fill, and the nine-slot container opens the vanilla 3x3 menu.
Not yet ported: the other 15 factory families, the eight higher tiers, the chemical families,
the single machines, the multiblocks, side configuration, upgrades, redstone control and the
machine's own GUI."""
authors = ["lostmyself8", "AdLf0208"]
license = "MIT"
homepage = "https://github.com/lostmyself8/Mekanism-MoreMachine"
issues = "https://github.com/lostmyself8/Mekanism-MoreMachine/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried data/ and assets/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not a hook's: the factory runs on the server, and a LAN host
# or single-player world runs it inside the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod declares a block, an item and a block entity, so the capability is used, not
# just required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
